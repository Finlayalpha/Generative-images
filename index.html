<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <title>Free Parking Finder</title>
  </head>
  <body>
    <div id="map" aria-label="Map"></div>

    <aside id="panel" aria-label="Search">
      <header>
        <h1>Free Parking Finder</h1>
        <button id="collapse" class="icon" aria-expanded="true" aria-controls="panel-body" title="Hide panel">▾</button>
      </header>
      <div id="panel-body">
        <div class="row">
          <label>Arrive
            <input id="arrive" type="datetime-local" />
          </label>
          <label>Stay
            <select id="stay">
              <option value="30">30 min</option>
              <option value="60">1 hour</option>
              <option value="120" selected>2 hours</option>
              <option value="240">4 hours</option>
              <option value="480">8 hours</option>
              <option value="720">Overnight (12h)</option>
              <option value="1440">24 hours</option>
            </select>
          </label>
        </div>
        <div class="row">
          <button id="search" class="primary">Search this area</button>
          <button id="locate" title="Use my location">Locate me</button>
        </div>
        <label class="check"><input id="only-free" type="checkbox" /> Only show free spots</label>
        <ul id="legend"></ul>
        <p id="status" role="status"></p>
        <p class="fine">
          Regulations from <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>
          contributors. Always check the signs on the street: data may be missing or out of date.
        </p>
      </div>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
